name: Release

# Push a tag like v0.2.0 (matching app/__init__.py) to build the Windows
# installer and publish a GitHub release with:
#   RDR-Setup-<version>.exe   one-click per-user installer
#   rdr-app-<version>.zip     app-only bundle used by "Update from GitHub release"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path "app\__init__.py" -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($v -ne $tag) { Write-Error "Tag v$tag does not match app version $v"; exit 1 }
      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rdr-windows
          path: |
            dist/RDR-Setup-*.exe
            dist/rdr-app-*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RDR-Setup-*.exe
            dist/rdr-app-*.zip
          generate_release_notes: true
