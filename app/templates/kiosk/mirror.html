{% extends "base.html" %}
{% block title %}Mirror · {{ mirror_site.name }}{% endblock %}
{% block body %}
<script src="/static/vendor/hls.min.js?v={{ version }}"></script>
<div class="mirror">
  <div class="mirror-head">
    <div class="row" style="gap:24px">
      <img class="riedel" src="/static/img/riedel.png" alt="Riedel">
      <span id="logoSep" style="width:1px;height:48px;background:var(--border){% if not event.logo_path %};display:none{% endif %}"></span><img class="event-logo" id="eventLogo" src="{{ event.logo_path or '' }}" alt="" {% if not event.logo_path %}style="display:none"{% endif %}>
    </div>
    <div class="title"><div class="ev live" id="evName">{{ event.name }}</div><div class="show live" id="evShow">{{ event.show_name or mirror_site.name }}</div></div>
  </div>
  <div class="mirror-body {% if feed.kind == 'unknown' %}no-video{% endif %} pgm-{{ pgm_size }}" id="body">
    <div id="main" class="main">
      <div class="idle"><div class="big">Welcome to RDR</div><div class="sub">Please give your name and role to the technician</div></div>
    </div>
    <div id="feedArea" class="video-wrap{% if feed.kind == 'unknown' %} hidden{% endif %}"></div>
  </div>
  <div class="mirror-foot"><span class="live" id="siteName">{{ mirror_site.name }}</span><span id="mclock"></span></div>
</div>
<script>
(function(){
  const SITE = {{ mirror_site.id }};
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const main = document.getElementById('main');
  let lastJson = '', greeting = {title: 'Welcome to RDR', sayings: [], prompt: 'Please give your name and role to {tech}'}, techName = null, sayingIdx = -1, idleShown = false, currentSaying = null;
  const asSaying = x => (typeof x === 'string' ? { text: x, credit: '' } : x);
  const pick = () => {
    const list = (greeting.sayings && greeting.sayings.length ? greeting.sayings : [greeting.title || 'Welcome to RDR']).map(asSaying);
    if (list.length > 1) { let i; do { i = Math.floor(Math.random() * list.length); } while (i === sayingIdx); sayingIdx = i; return list[i]; }
    return list[0];
  };
  const idleHtml = () => { const sy = asSaying(currentSaying || (currentSaying = pick())); return `<div class="idle ${fresh ? 'anim' : ''}"><div class="big" id="saying">${esc(sy.text)}</div>${sy.credit ? `<div class="credit">${esc(sy.credit)}</div>` : ''}<div class="sub">${esc((greeting.prompt || 'Please give your name and role to {tech}').replace('{tech}', techName || 'the technician'))}</div></div>`; };
  async function tick(){
    try {
      const r = await fetch(`/api/mirror/${SITE}`, {cache:'no-store'});
      const data = await r.json();
      applyConfig(data.config);
      const s = data.state || {};
      if (data.greeting) greeting = data.greeting;
      if (s.tech_name) techName = s.tech_name;
      const away = data.away || null;
      const j = JSON.stringify(s) + JSON.stringify(greeting) + JSON.stringify(away ? [away.label, away.note, away.until_hm, away.remaining, away.overdue] : null);
      if (j !== lastJson) { lastJson = j; away ? renderAway(away) : render(s); }
    } catch (e) {}
  }
  let stagger = 0;
  // The customer side shows what, not which: types with counts, and the person's Bolero ID on their pack.
  function group(items, person, incoming) {
    const out = [];
    for (const i of items || []) {
      const isBolero = /bolero/i.test(i.type) && !/antenna/i.test(i.type);
      // packs being handed over take this person's ID; packs already out show the ID they were linked with
      const id = isBolero ? (incoming ? ((person && person.bolero_id) || '') : (i.linked_id || (person && person.bolero_id) || '')) : '';
      const key = i.type + '|' + id;
      let g = out.find(x => x.key === key);
      if (!g) { g = { key, type: i.type, id, n: 0 }; out.push(g); }
      g.n++;
    }
    return out;
  }
  // Animate only what is new: a screen change animates everything, an added item animates just itself.
  let lastMode = '', lastKeys = new Set(), seenKeys = new Set(), fresh = true;
  let faceplate = '';
  const chip = id => `<span class="bolero${faceplate ? ' faced' : ''}"${faceplate ? ` style="--face:#${esc(faceplate)}"` : ''}>Bolero ${esc(String(id).replace(/^bolero\s*/i, ''))}</span>`;
  const item = (g, small) => { const isNew = fresh || !lastKeys.has(g.key); seenKeys.add(g.key); return `<li class="${isNew ? 'anim' : ''}${small ? ' small' : ''}"${isNew ? ` style="animation-delay:${(stagger++) * 60}ms"` : ''}><span>${g.n > 1 ? `<span class="count">${g.n} ×</span> ` : ''}${esc(g.type)}${g.id ? ' ' + chip(g.id) : ''}</span></li>`; };
  const heading = t => `<div class="heading">${t}</div>`;
  // Swap screens with a short fade/slide instead of a hard cut.
  let swapping = null;
  function swap(html, mode) {
    const changed = mode !== lastMode;
    lastMode = mode; lastKeys = seenKeys; seenKeys = new Set();
    main.classList.toggle('is-idle', mode === 'idle');
    if (!changed) { main.innerHTML = html; return; }          // same screen: update in place, no fade
    if (swapping) clearTimeout(swapping);
    main.classList.add('leaving');
    swapping = setTimeout(() => { main.innerHTML = html; main.classList.remove('leaving'); main.classList.toggle('is-idle', mode === 'idle'); swapping = null; }, 220);
  }
  function begin(mode) { fresh = mode !== lastMode; stagger = 0; }
  // Desk closed for a moment: keep the feed, replace the welcome with when the tech is back.
  function renderAway(a) {
    const big = a.overdue ? 'Back any moment' : (a.remaining != null && a.label.startsWith('Back in') ? `Back in ${a.remaining} min` : a.label);
    const sub = a.note || 'The desk is unattended for a moment';
    begin('away');
    swap(`<div class="idle ${fresh ? 'anim' : ''}"><div class="k">Away from desk</div><div class="big">${esc(big)}</div>${a.until_hm && !a.overdue ? `<div class="credit">until ${esc(a.until_hm)}</div>` : ''}<div class="sub">${esc(sub)}</div></div>`, 'idle');
    idleShown = false;   // a fresh saying when the desk reopens
  }
  function render(s){
    if (s.result && s.result.items && s.result.items.length) {
      const kind = s.result.kind;
      const mode = 'result:' + (s.result.ts || '');
      begin(mode); faceplate = (s.result.personInfo || {}).faceplate || '';
      const groups = group(s.result.items, s.result.personInfo);
      swap(`
        <div class="who ${fresh ? 'anim' : ''}">${esc(s.result.person || 'Items processed')}<small>${kind === 'out' ? 'Signed out to you' : 'Signed in, thank you'}</small></div>
        <ul class="items">${groups.map(g => item(g)).join('')}</ul>
        <div class="result ${kind} ${fresh ? 'anim' : ''}" style="animation-delay:${groups.length * 60 + 80}ms">${kind === 'out' ? (Math.random() < 0.5 ? 'Have a great show!' : 'Have a great day!') : 'All checked in, thank you'}</div>`, mode);
      return;
    }
    if (!s.person && !(s.basket && s.basket.length)) {
      if (!idleShown) currentSaying = pick();   // a new saying only when coming back from an interaction
      begin('idle');
      swap(idleHtml(), 'idle'); idleShown = true;
      return;
    }
    idleShown = false;
    const p = s.person || {};
    const mode = 'person:' + (p.name || '');
    begin(mode); faceplate = p.faceplate || '';
    const held = group(s.holdings, p), now = group(s.basket, p, true);
    swap(`
      <div class="who ${fresh ? 'anim' : ''}">${p.name ? 'Hi! ' + esc(p.name) : 'Processing items'}<small>${esc([p.dept, p.role].filter(Boolean).join(' · ') || (p.name ? '' : 'One moment please'))}${p.bolero_id ? ' ' + chip(p.bolero_id) : ''}${p.radio ? ` <span class="bolero radio">${esc(p.radio)}</span>` : ''}${p.collector ? `<br>Collected by ${esc(p.collector)}` : ''}</small></div>
      ${held.length ? heading('Already with you') + `<ul class="items">${held.map(g => item(g, true)).join('')}</ul>` : ''}
      ${now.length ? heading('Being processed') + `<ul class="items">${now.map(g => item(g)).join('')}</ul>` : ''}`, mode);
  }
  setInterval(tick, 1000); tick();
  // ---- live configuration: header, site name, feed and layout follow admin edits without a reload
  let configVersion = null, FEED = {{ feed | tojson }};
  const setText = (id, text) => { const el = document.getElementById(id); if (el && el.textContent !== text) { el.textContent = text; el.classList.remove('live-swap'); void el.offsetWidth; el.classList.add('live-swap'); } };
  function applyConfig(c) {
    if (!c || c.version === configVersion) return;
    const first = configVersion === null;
    configVersion = c.version;
    setText('evName', c.event.name || ''); setText('evShow', c.event.show_name || c.site.name || ''); setText('siteName', c.site.name || '');
    const logo = document.getElementById('eventLogo'), sep = document.getElementById('logoSep');
    if (c.event.logo_path) { if (logo.getAttribute('src') !== c.event.logo_path) logo.src = c.event.logo_path; logo.style.display = ''; sep.style.display = ''; } else { logo.style.display = 'none'; sep.style.display = 'none'; }
    const body = document.getElementById('body');
    body.classList.remove('pgm-small', 'pgm-half', 'pgm-large'); body.classList.add('pgm-' + (c.feed.size || 'half'));
    const changed = JSON.stringify(c.feed) !== JSON.stringify(FEED);
    FEED = c.feed;
    if (changed || first) setupFeed(FEED, !first);
  }

  // ---- programme feed: RTSP / capture card via the server relay, direct HLS, a file, or a YouTube embed
  let hls = null, pingTimer = null;
  function teardownFeed() {
    if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    document.getElementById('feedArea').innerHTML = '';
  }
  function setupFeed(feed, animate) {
    teardownFeed();
    const area = document.getElementById('feedArea'), body = document.getElementById('body');
    const show = feed && feed.kind !== 'unknown';
    body.classList.toggle('no-video', !show);
    area.classList.toggle('hidden', !show);
    if (!show) return;
    if (feed.kind === 'youtube' && feed.embed) {
      area.innerHTML = `<div class="video${animate ? ' anim' : ''}" style="--pgm-aspect: 16 / 9"><span class="pgm">PGM</span><iframe src="${feed.embed}" allow="autoplay; encrypted-media" allowfullscreen frameborder="0"></iframe></div>`;
      return;
    }
    area.innerHTML = `<div class="video${animate ? ' anim' : ''}" id="video"><span class="pgm">PGM</span><video id="pgm" muted autoplay playsinline loop></video><div class="status" id="pgmStatus">Connecting to programme feed…</div></div>`;
    const videoEl = document.getElementById('pgm'), statusEl = document.getElementById('pgmStatus'), box = document.getElementById('video');
    videoEl.addEventListener('loadedmetadata', () => {
      if (videoEl.videoWidth && videoEl.videoHeight) {
        box.style.setProperty('--pgm-aspect', `${videoEl.videoWidth} / ${videoEl.videoHeight}`);
        box.style.setProperty('--pgm-ratio', (videoEl.videoWidth / videoEl.videoHeight).toFixed(4));
      }
    });
    if (feed.kind === 'file') { videoEl.src = feed.url; statusEl.classList.add('hidden'); videoEl.play().catch(() => {}); return; }
    let attached = false;
    async function pingStream() {
      try {
        let st;
        if (feed.kind === 'hls') { st = {ready: true, playlist: feed.url}; }
        else { const r = await fetch(`/api/stream/${SITE}/ping`, {cache: 'no-store'}); st = await r.json(); }
        if (st.error && !st.running) { statusEl.textContent = st.error; statusEl.classList.remove('hidden'); attached = false; if (hls) { hls.destroy(); hls = null; } return; }
        if (st.ready && !attached) {
          attached = true;
          const src = feed.kind === 'hls' ? st.playlist : st.playlist + '?t=' + Date.now();
          if (window.Hls && Hls.isSupported()) {
            hls = new Hls({lowLatencyMode: true, liveSyncDurationCount: 2, liveMaxLatencyDurationCount: 4, maxBufferLength: 4, backBufferLength: 0});
            hls.loadSource(src); hls.attachMedia(videoEl);
            hls.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) { attached = false; hls.destroy(); hls = null; statusEl.textContent = 'Feed interrupted, reconnecting…'; statusEl.classList.remove('hidden'); } });
          } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
            videoEl.src = src;
          } else { statusEl.textContent = 'This browser cannot play HLS'; return; }
          videoEl.play().catch(() => {});
          statusEl.classList.add('hidden');
        } else if (!st.ready) { statusEl.textContent = 'Starting programme feed…'; statusEl.classList.remove('hidden'); }
      } catch (e) { /* server away; try again */ }
    }
    pingTimer = setInterval(pingStream, 4000); pingStream();
  }
  setupFeed(FEED, false);
})();
</script>
{% endblock %}
